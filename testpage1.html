<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeyRon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .header {
      height: 100px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .header img {
      height: 60px;
    }

    .header span {
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      margin-left: 16px;
    }

    /* CONSTRAIN THE TABLE to 60/40 */
.content-table {
  width: 100%;
  height: 33.66vh;
  table-layout: fixed;
  border-collapse: collapse;
}

.content-table tr {
  height: 100%;
}

.content-table td {
  height: 100%;
}

    .content-table td {
      vertical-align: top;
    }

    .text-cell {
      width: 40.00%;
      padding: 40px;
      background: #f8f9fa;
    }

    .image-cell {
      width: 60%;
      padding: 0;
    }

    /* SPACE SCENE (now lives inside the cell) */
    .space-scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090c;
    }

    .bg {
      position: absolute;
      width: 120%;
      left: -10%;
      bottom: 0;
    }

    .ship {
      position: absolute;
      right: 12%;
      top: 35%;
      width: 260px;
      filter: blur(.5px) brightness(0.90);
      opacity: 0.95;
    }
/*--RACCOON FLOATING ANIMATION --*/
.raccoon {
  position: absolute;
  left: 20%;
  top: 30%;
  width: 140px;
  animation: floatWander 12s ease-in-out infinite;
}

@keyframes floatWander {
  0%   { transform: translate(0px, 0px) rotate(-2deg); }
  20%  { transform: translate(15px, -20px) rotate(2deg); }
  40%  { transform: translate(-10px, -35px) rotate(-1deg); }
  60%  { transform: translate(20px, -15px) rotate(3deg); }
  80%  { transform: translate(-15px, -25px) rotate(-2deg); }
  100% { transform: translate(0px, 0px) rotate(-2deg); }
}

.space-scene {
  height: 100%;
  max-height: 33.33vh;
}
 
  </style>
</head>

<body>

  <div class="header">
    <img src="assets/logo.png" alt="HeyRon Logo">
    <span>HeyRon</span>
  </div>

  <table class="content-table">
    <tr>

      <td class="text-cell">
        <h2>Welcome to HeyRon</h2>
        <p>HeyRon is your AI-powered digital assistant designed to help you navigate the modern web with ease.</p>
        <p>Built on cutting-edge AI technology, I adapt to your workflow and learn from your preferences.</p>
        <p>Ready to see what I can do? Let's explore together.</p>
      </td>

      <td class="image-cell">
        <!-- ✅ MOVED HERE -->
        <div class="space-scene">
          <img src="assets/bg-space.png" class="bg">
          <img src="assets/ship.png" class="ship">
          <img src="assets/raccoon.png" class="raccoon">
        </div>
      </td>

    </tr>
  </table>

</body>
</html>
