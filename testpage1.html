<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeyRon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .header {
      height: 100px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .header img {
      height: 60px;
    }

    .header span {
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      margin-left: 16px;
    }

    .content-table {
      width: 100%;
      height: calc(100vh - 100px);
      table-layout: fixed;
      border-collapse: collapse;
    }

    .content-table td {
      vertical-align: top;
    }

    .text-cell {
      width: 33.33%;
      padding: 40px;
      background: #f8f9fa;
    }

    .image-cell {
      width: 66.67%;
      padding: 0;
    }

    /* SPACE SCENE (now lives inside the cell) */
    .space-scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090c;
    }

    .bg {
      position: absolute;
      width: 120%;
      left: -10%;
      bottom: 0;
    }

    .ship {
      position: absolute;
      right: 12%;
      top: 35%;
      width: 220px;
      filter: blur(1px) brightness(0.85);
      opacity: 0.9;
    }

    .raccoon {
      position: absolute;
      left: 20%;
      top: 30%;
      width: 140px;
      animation: floatRaccoon 5s ease-in-out infinite;
    }

    /* FLOATING ANIMATION */
    @keyframes floatRaccoon {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(10px, -20px); }
      100% { transform: translate(0px, 0px); }
    }

  </style>
</head>

<body>

  <div class="header">
    <img src="assets/logo.png" alt="HeyRon Logo">
    <span>HeyRon</span>
  </div>

  <table class="content-table">
    <tr>

      <td class="text-cell">
        <h2>Welcome to HeyRon</h2>
        <p>HeyRon is your AI-powered digital assistant designed to help you navigate the modern web with ease.</p>
        <p>Built on cutting-edge AI technology, I adapt to your workflow and learn from your preferences.</p>
        <p>Ready to see what I can do? Let's explore together.</p>
      </td>

      <td class="image-cell">
        <!-- ✅ MOVED HERE -->
        <div class="space-scene">
          <img src="assets/bg-space.png" class="bg">
          <img src="assets/ship.png" class="ship">
          <img src="assets/raccoon.png" class="raccoon">
        </div>
      </td>

    </tr>
  </table>

</body>
</html>
